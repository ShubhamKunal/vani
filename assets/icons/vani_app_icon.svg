<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Electric Indigo to Royal Acoustic Navy -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="60%" stop-color="#3730A3"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Divine Golden Warmth for Saraswati / Goddess Vani accents -->
    <linearGradient id="goldVeena" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Pure Resonant White Gradient -->
    <linearGradient id="whiteChords" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>

    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- iOS / Android Squircle App Icon Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGradient)" filter="url(#iconGlow)"/>
  <!-- Polished Inner Bevel Stroke -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>

  <!-- Subtle Sacred Geometric Concentric Soundwave Rings (Acoustic Om / Nāda) -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#A5B4FC" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="6 8"/>
  <circle cx="256" cy="256" r="132" fill="none" stroke="#A5B4FC" stroke-opacity="0.15" stroke-width="2"/>
  <circle cx="256" cy="256" r="92" fill="none" stroke="#A5B4FC" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Left Acoustic Sound Wave 1 (Graceful Veena Gourd Resonance Curve) -->
  <path d="M 170 190 C 146 226 146 286 170 322 C 174 328 166 336 158 330 C 130 286 130 226 158 182 C 166 176 174 184 170 190 Z" 
        fill="#A5B4FC" fill-opacity="0.6"/>

  <!-- Left Acoustic Sound Wave 2 (Middle Amplitude) -->
  <path d="M 204 162 C 180 214 180 298 204 350 C 208 358 198 364 190 356 C 160 296 160 216 190 156 C 198 148 208 154 204 162 Z" 
        fill="#C7D2FE" fill-opacity="0.85"/>

  <!-- Right Acoustic Sound Wave 2 (Middle Amplitude) -->
  <path d="M 308 162 C 332 214 332 298 308 350 C 304 358 314 364 322 356 C 352 296 352 216 322 156 C 314 148 304 154 308 162 Z" 
        fill="#C7D2FE" fill-opacity="0.85"/>

  <!-- Right Acoustic Sound Wave 1 (Outer Amplitude) -->
  <path d="M 342 190 C 366 226 366 286 342 322 C 338 328 346 336 354 330 C 382 286 382 226 354 182 C 346 176 338 184 342 190 Z" 
        fill="#A5B4FC" fill-opacity="0.6"/>

  <!-- Center Piece: Sacred Veena Stem merging into Divine Speech Flame / 'V' for Vani -->
  <!-- Main Resonator Stem -->
  <path d="M 256 128 C 263 128 268 133 268 140 L 268 348 C 268 368 254 384 234 384 C 218 384 206 372 206 356 C 206 346 214 338 224 338 C 234 338 242 346 242 356 C 242 360 245 363 249 363 C 253 363 256 360 256 356 L 256 140 C 256 133 261 128 256 128 Z"
        fill="url(#whiteChords)"/>

  <!-- Golden String Tuning Peg / Nāda Bindu (Center of Acoustic Wisdom) -->
  <circle cx="256" cy="224" r="18" fill="url(#goldVeena)" filter="url(#iconGlow)"/>
  <circle cx="256" cy="224" r="26" fill="none" stroke="#FDE047" stroke-width="2.5" stroke-opacity="0.7"/>

  <!-- Top Crown Flame of Speech (Vāgdevī Peacock Feather Quill / Sacred Lotus Bud) -->
  <path d="M 256 96 C 268 112 278 126 278 138 C 278 150 268 158 256 158 C 244 158 234 150 234 138 C 234 126 244 112 256 96 Z"
        fill="url(#goldVeena)"/>

  <!-- Golden Chords / Strings (Resonant Sound Vibration lines) -->
  <line x1="250" y1="162" x2="250" y2="340" stroke="#FDE047" stroke-width="2" stroke-opacity="0.75"/>
  <line x1="262" y1="162" x2="262" y2="340" stroke="#FDE047" stroke-width="2" stroke-opacity="0.75"/>

  <!-- Pure light gleam on top left rim -->
  <path d="M 64 64 Q 130 36 256 36" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-opacity="0.4"/>
</svg>

